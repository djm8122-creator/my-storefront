<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Signup</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="bg-dark text-white p-3">
        <div class="container">
            <h1>My Storefront</h1>
        </div>
    </header>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="storefront.html">My Store</a>

            <div class="navbar-nav">
                <a class="nav-link" href="storefront.html">Home</a>
                <a class="nav-link active" href="signup.html">Sign Up</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mt-5 mb-5">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <h2 class="mb-4">User Signup</h2>

                <form>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username:
                        </label>

                        <input type="text"
                               class="form-control"
                               id="username"
                               name="username"
                               placeholder="Enter username"
                               required>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email:
                        </label>

                        <input type="email"
                               class="form-control"
                               id="email"
                               name="email"
                               placeholder="Enter email"
                               required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password:
                        </label>

                        <input type="password"
                               class="form-control"
                               id="password"
                               name="password"
                               placeholder="Enter password"
                               required>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password:
                        </label>

                        <input type="password"
                               class="form-control"
                               id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Confirm password"
                               required>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary">
                        Sign Up
                    </button>

                    <a href="storefront.html" class="btn btn-secondary">
                        Back to Store
                    </a>

                </form>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 My Storefront</p>
    </footer>

</body>
</html>
